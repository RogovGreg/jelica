[project]
name = "jelica-cli"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Command-line interface for JELICA."
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.16.0,<1.0.0", "jelica-contracts", "jelica-core"]

[project.scripts]
jelica = "jelica_cli.main:main"

[tool.uv.sources]
jelica-contracts = { workspace = true }
jelica-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

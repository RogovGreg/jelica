[project]
name = "jelica-api"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "FastAPI web backend foundation for JELICA."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.5,<2.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "fastapi>=0.116.1,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "psycopg[binary]>=3.2.10,<4.0.0",
    "pywebpush>=2.0.3,<3.0.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "jelica-contracts",
]

[project.scripts]
jelica-api = "jelica_api.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
jelica-contracts = { workspace = true }
